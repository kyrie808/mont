<style>
body{margin:0}
a{color:#2C1810}a:hover{color:#3D2B22}
.in{height:48px;border:1px solid #C9B9A6;border-radius:12px;padding:0 14px;font:500 15px 'DM Sans',sans-serif;color:#2C1810;background:#FFFFFF;box-sizing:border-box;width:100%}

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF7F2; font-family: 'DM Sans', sans-serif; color: #2C1810">
<header style="height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E6DDD2">
<a href="Sacola.dc.html" aria-label="Voltar para a sacola" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 22px">←</a>
<span style="font-size: 16px; font-weight: 700">Seus dados</span>
<span style="margin-left: auto; padding-right: 12px; font-size: 12px; color: #6B5A4E">1 Sacola · 2 Dados · 3 Pagamento</span>
</header>
<form style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label class="lb" for="cel">Seu WhatsApp</label>
<input class="in" id="cel" type="tel" value="(11) 98765-4321" style="border: 1.5px solid #2C1810">
<span style="font-size: 12px; color: #6B5A4E">Sem senha. É por ele que avisamos o andamento do pedido.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label class="lb" for="nome">Seu nome</label>
<input class="in" id="nome" value="Ana Souza">
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px"><label class="lb" for="cep">CEP</label><input class="in" id="cep" value="09600-000"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label class="lb" for="num">Número</label><input class="in" id="num" value="123"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label class="lb" for="rua">Rua (preenche pelo CEP)</label>
<input class="in" id="rua" value="Rua [ENDEREÇO] · Rudge Ramos">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label class="lb" for="comp">Complemento ou ponto de referência</label>
<input class="in" id="comp" placeholder="Ex.: portão verde, casa 2">
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; background: #EFE7DC">
<span class="lb">Entrega prevista</span>
<span style="font-size: 14px">[DIA] · pela regra de prazo do seu bairro</span>
</div>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #3D2B22; margin-top: 4px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; flex-shrink: 0"> Quero receber ofertas da Mont no WhatsApp. Dá para sair quando quiser.</label>
</form>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: #FAF7F2; border-top: 1px solid #E6DDD2">
<a href="Pagamento.dc.html" style="height: 56px; border-radius: 28px; background: #E8923A; color: #2C1810; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Ir para o pagamento</a>
</div>
</div>
